name: CI

on:
  push:
    branches: [deployment-test]
  pull_request:
    branches: [deployment-test]

jobs:
  server-build-and-test:
    name: Server - Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tamu-planner/server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tamu-planner/server/package-lock.json

      - run: npm ci

      - name: Build & run tests
        run: npm test

  frontend-build-and-test:
    name: Frontend - Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tamu-planner/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tamu-planner/frontend/package-lock.json

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Vite production build
        run: npm run build
        env:
          VITE_API_BASE: http://localhost:4000
          VITE_FIREBASE_API_KEY: dummy
          VITE_FIREBASE_AUTH_DOMAIN: dummy
          VITE_FIREBASE_PROJECT_ID: dummy
          VITE_FIREBASE_APP_ID: dummy
